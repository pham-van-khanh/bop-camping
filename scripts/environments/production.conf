# Deployment Environment
ENV_NAME=production

# Git
REPOSITORY=git@github.com:pham-van-khanh/bop-camping.git
BRANCH=feat/scaffold-laravel

# Server
APP_DIR=/var/www/production

# Runtime
PHP_BIN=php
COMPOSER_BIN=composer
NPM_BIN=npm

# Deployment
KEEP_RELEASES=5

# Services
PHP_FPM_SERVICE=php8.3-fpm
QUEUE_RESTART=true

# Health check (used to gate the release + auto-rollback on failure)
# Hits Laravel's built-in /up endpoint on the loopback over HTTPS. HEALTH_HOST
# sends the Host header so nginx routes to the bopcamping.com server block
# (since Certbot/SSL, the loopback IP no longer matches any server_name and
# would 404 on the default server). health-check.sh uses curl -k so the cert
# name mismatch on 127.0.0.1 is ignored.
HEALTH_URL=https://127.0.0.1/up
HEALTH_HOST=bopcamping.com
HEALTH_RETRIES=5
HEALTH_DELAY=3