# Deployment Environment
ENV_NAME=staging

# Git
REPOSITORY=git@github.com:pham-van-khanh/bop-camping.git
BRANCH=develop

# Server
APP_DIR=/var/www/staging

# Runtime
PHP_BIN=php
COMPOSER_BIN=composer
NPM_BIN=npm

# Deployment
KEEP_RELEASES=5

# Services
PHP_FPM_SERVICE=php8.3-fpm
QUEUE_RESTART=true

# Health check (used to gate the release + auto-rollback on failure)
# Hits Laravel's built-in /up endpoint locally. Set HEALTH_HOST to the real
# domain so name-based vhosts route correctly (leave empty if not needed).
HEALTH_URL=http://127.0.0.1/up
HEALTH_HOST=
HEALTH_RETRIES=5
HEALTH_DELAY=3