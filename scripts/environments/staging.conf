# Deployment Environment
ENV_NAME=staging

# Git
REPOSITORY=git@github.com:pham-van-khanh/bop-camping.git
BRANCH=develop

# Server
APP_DIR=/var/www/staging

# Runtime
PHP_BIN=php
COMPOSER_BIN=composer
NPM_BIN=npm

# Deployment
KEEP_RELEASES=5

# Services
PHP_FPM_SERVICE=php8.3-fpm
QUEUE_RESTART=true
# Scheduler cron (staging)
# KHÔNG chạy scheduler: staging dùng chung host+user deploy với production,
# bật lên là khách nhận mail nhắc TRÙNG. deploy.sh sẽ tự xoá entry nếu đã có.
SCHEDULER_CRON=false


# Health check (used to gate the release + auto-rollback on failure)
# Hits Laravel's built-in /up endpoint on the loopback over HTTPS. HEALTH_HOST
# sends the Host header so nginx routes to the staging.bopcamping.cloud server
# block (the loopback IP matches no server_name and would 404 on the default
# server). health-check.sh uses curl -k so the cert name mismatch is ignored.
HEALTH_URL=https://127.0.0.1/up
HEALTH_HOST=staging.bopcamping.cloud
HEALTH_RETRIES=5
HEALTH_DELAY=3